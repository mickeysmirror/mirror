<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mickey's Mirror</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: #c9a050; /* Vintage Gold */
        }

        #container {
            position: relative;
            width: 90%;
            max-width: 500px;
            border: 5px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background: #000;
        }

        video, canvas {
            width: 100%;
            display: block;
        }

        /* Filter Classes */
        .filter-none { filter: none; }
        .filter-vintage { filter: sepia(0.5) contrast(1.2) brightness(0.9); }
        .filter-bw { filter: grayscale(1) contrast(1.1); }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #333;
            color: #fff;
            border: 1px solid #c9a050;
            padding: 10px 15px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        button:hover {
            background: #c9a050;
            color: #000;
        }

        #capture-btn {
            background: #c9a050;
            color: #000;
            font-weight: bold;
        }

        #photo-strip {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            width: 90%;
            padding: 10px;
        }

        .thumbnail {
            width: 80px;
            border: 2px solid #c9a050;
        }
    </style>
</head>
<body>

    <h1>Mickey's Mirror</h1>

    <div id="container">
        <video id="video" autoplay playsinline></video>
    </div>

    <div class="controls">
        <button onclick="setFilter('filter-none')">Real</button>
        <button onclick="setFilter('filter-vintage')">1949</button>
        <button onclick="setFilter('filter-bw')">Classic</button>
        <button id="capture-btn" onclick="takePhoto()">Capture</button>
    </div>

    <div id="photo-strip"></div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photoStrip = document.getElementById('photo-strip');
        let currentFilter = 'filter-none';

        // Start Camera
        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
            } catch (e) {
                console.error("Error accessing camera: ", e);
                alert("Camera access denied or not available.");
            }
        }

        function setFilter(filterClass) {
            video.className = filterClass;
            currentFilter = filterClass;
        }

        function takePhoto() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Apply filter to canvas
            context.filter = getComputedStyle(video).filter;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const data = canvas.toDataURL('image/png');
            const img = document.createElement('img');
            img.src = data;
            img.className = 'thumbnail';
            
            // Add to strip (newest first)
            photoStrip.insertBefore(img, photoStrip.firstChild);
        }

        init();
    </script>
</body>
</html>
