<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mickey's Mirror</title>
<style>
    html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        background: #000; overflow: hidden;
    }

    /* The Logo as the Full Background */
    #logo-bg {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        object-fit: contain; /* Keeps the logo from stretching weirdly */
        z-index: 1;
        opacity: 0.6; /* Adjust this to make logo darker or brighter */
    }

    /* The Camera Feed */
    #video {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        object-fit: cover;
        z-index: 2;
        /* This blend mode makes the person appear 'inside' the logo */
        mix-blend-mode: screen; 
        filter: contrast(1.2) brightness(1.1);
    }
</style>
</head>
<body>

<img id="logo-bg" src="alb-logo.png">
<video id="video" autoplay playsinline muted></video>

<script>
    async function init() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user' },
                audio: false
            });
            document.getElementById('video').srcObject = stream;
        } catch (e) {
            console.error("Camera blocked or not found.");
        }
    }
    init();
</script>

</body>
</html>
