<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mickey's Mirror</title>
<style>
    html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        background: #000; overflow: hidden;
    }

    #video {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        object-fit: cover;
        transform: scaleX(-1); 
    }

    #logo-watermark {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 100px;
        opacity: 0.6;
        z-index: 10;
        pointer-events: none;
    }

    #mirror-text {
        position: fixed;
        top: 10%;
        left: 50%;
        transform: translateX(-50%);
        width: 80%;
        text-align: center;
        color: #c9a050; /* Mickey's Gold */
        font-family: 'Courier New', Courier, monospace;
        font-size: 1.1rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        z-index: 20;
        /* Subtle glow to keep it readable in bar lighting */
        text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 5px rgba(201, 160, 80, 0.5);
        pointer-events: none;
    }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<img id="logo-watermark" src="alb-logo.png">

<!-- This is where the random text will appear -->
<div id="mirror-text"></div>

<script>
    // MICKEY'S FORTUNES & REMINDERS
    const fortunes = [
        "ESTABLISHED 1950. YOU? MUCH LATER.",
        "THIS MIRROR DOESN'T LIE. YOU'RE DOING GREAT.",
        "HAPPY HOUR UNTIL 6PM. DON'T BE LATE.",
        "BE NICE OR LEAVE.",
        "REAL CONVERSATION HAPPENS HERE. well, not in the bathroom.",
        "A NASHVILLE ORIGINAL. JUST LIKE YOU.",
        "PUT THE PHONE DOWN AFTER THIS PHOTO.",
        "HISTORY LOOKS GOOD ON YOU.",
        "STILL REAL SINCE 1950.",
        "YOU LOOK LIKE YOU NEED A COLD ONE."
    ];

    function setRandomFortune() {
        const textElement = document.getElementById('mirror-text');
        const randomIndex = Math.floor(Math.random() * fortunes.length);
        textElement.innerText = fortunes[randomIndex];
    }

    async function init() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user' },
                audio: false
            });
            document.getElementById('video').srcObject = stream;
            
            // Set the fortune once the camera is ready
            setRandomFortune();
        } catch (e) {
            // If they block the camera, we still show the text
            document.getElementById('mirror-text').innerText = "ALLOW CAMERA TO SEE THE MIRROR.";
        }
    }

    init();
</script>

</body>
</html>
