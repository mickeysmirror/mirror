<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mickey's Mirror</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

#logo {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80vw;
    max-width: 600px;
    opacity: 0.3;
    z-index: 1;
}

#video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    background: #000;
    z-index: 2;
    mix-blend-mode: lighten;
}
</style>
</head>

<body>

<img id="logo" src="alb-logo.png" alt="">
<video id="video" autoplay playsinline muted></video>

<script>
const video = document.getElementById('video');

async function init() {
    const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' },
        audio: false
    });
    video.srcObject = stream;
}

init();
</script>

</body>
</html>
