<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mickey's Mirror</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #1a1a1a; color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh;
        }
        h1 { font-size: 1.5rem; letter-spacing: 3px; color: #c9a050; text-transform: uppercase; }
        #container {
            position: relative; width: 90%; max-width: 500px;
            border: 5px solid #333; background: #000;
        }
        video { width: 100%; display: block; background: #222; }
        #overlay-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; pointer-events: none;
        }
        .controls { margin-top: 20px; display: flex; gap: 10px; }
        button {
            background: #333; color: #fff; border: 1px solid #c9a050;
            padding: 12px 20px; cursor: pointer; text-transform: uppercase;
        }
        #hat-toggle.active { background: #c9a050; color: #000; }
        #status { font-size: 0.8rem; color: #c9a050; margin: 10px; text-align: center; }
        #photo-strip { display: flex; gap: 10px; margin-top: 20px; overflow-x: auto; width: 90%; }
        .thumbnail { width: 80px; border: 2px solid #c9a050; }
    </style>
</head>
<body>

    <h1>Mickey's Mirror</h1>
    <div id="status">Initializing Camera...</div>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay-canvas"></canvas>
    </div>

    <div class="controls">
        <button id="start-btn" onclick="init()">Start Camera</button>
        <button id="hat-toggle" onclick="toggleHat()">ALB Hat</button>
        <button onclick="takePhoto()">Capture</button>
    </div>

    <div id="photo-strip"></div>
    <canvas id="canvas" style="display:none;"></canvas>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>

    <script>
        const video = document.getElementById('video');
        const overlayCanvas = document.getElementById('overlay-canvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const hatToggleBtn = document.getElementById('hat-toggle');
        
        let hatEnabled = false;
        let faceDetection;
        let hatImage = new Image();
        hatImage.src = 'alb-logo.png';

        async function init() {
            statusDiv.textContent = "Requesting Camera...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' }, 
                    audio: false 
                });
                video.srcObject = stream;
                document.getElementById('start-btn').style.display = 'none';
                
                video.onloadedmetadata = () => {
                    overlayCanvas.width = video.videoWidth;
                    overlayCanvas.height = video.videoHeight;
                    statusDiv.textContent = "Loading Face Tracking...";
                    setupFaceDetection();
                };
            } catch (e) {
                statusDiv.textContent = "Error: " + e.message;
                console.error(e);
            }
        }

        function setupFaceDetection() {
            faceDetection = new window.FaceDetection({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
            });

            faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.5 });
            faceDetection.onResults(onResults);

            const camera = new window.Camera(video, {
                onFrame: async () => {
                    await faceDetection.send({ image: video });
                },
                width: 640, height: 480
            });
            camera.start();
            statusDiv.textContent = "Mirror Active";
        }

        function onResults(results) {
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            if (hatEnabled && results.detections.length > 0) {
                const det = results.detections[0].boundingBox;
                const w = det.width * overlayCanvas.width * 1.4;
                const h = w * 0.5;
                const x = det.xCenter * overlayCanvas.width - w/2;
                const y = det.yCenter * overlayCanvas.height - (det.height * overlayCanvas.height * 0.9);

                // Draw Cap
                overlayCtx.fillStyle = '#111';
                overlayCtx.beginPath();
                overlayCtx.ellipse(x + w/2, y + h*0.4, w/2, h*0.4, 0, 0, Math.PI*2);
                overlayCtx.fill();

                // Draw Logo
                if (hatImage.complete) {
                    const lw = w * 0.6;
                    const lh = lw * (hatImage.height / hatImage.width);
                    overlayCtx.drawImage(hatImage, x + w/2 - lw/2, y + h*0.1, lw, lh);
                }
            }
        }

        function toggleHat() {
            hatEnabled = !hatEnabled;
            hatToggleBtn.classList.toggle('active');
        }

        function takePhoto() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            if (hatEnabled) ctx.drawImage(overlayCanvas, 0, 0);
            
            const img = document.createElement('img');
            img.src = canvas.toDataURL('image/png');
            img.className = 'thumbnail';
            document.getElementById('photo-strip').prepend(img);
        }
    </script>
</body>
</html>
