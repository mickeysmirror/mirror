<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mickey’s Mirror</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
}

#video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    background: #000;
}

#overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
}

#prompt {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #c9a050;
    font-size: 1.2rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    z-index: 10;
}

#hatToggle {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    border: 1px solid #c9a050;
    color: #c9a050;
    padding: 10px 18px;
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    z-index: 5;
}

#hatToggle.active {
    background: #c9a050;
    color: #000;
}
</style>
</head>

<body>

<div id="prompt">Allow Mickey’s Mirror</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>

<button id="hatToggle">ALB Hat</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const prompt = document.getElementById('prompt');
const hatToggle = document.getElementById('hatToggle');

let hatOn = false;
let faceDetection;
let hatImage = new Image();
hatImage.src = 'alb-logo.png';

prompt.addEventListener('click', startCamera);
hatToggle.addEventListener('click', () => {
    hatOn = !hatOn;
    hatToggle.classList.toggle('active');
});

async function startCamera() {
    prompt.style.display = 'none';

    const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' },
        audio: false
    });

    video.srcObject = stream;

    video.onloadedmetadata = () => {
        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;
        initFaceTracking();
    };
}

function initFaceTracking() {
    faceDetection = new window.FaceDetection({
        locateFile: file =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
    });

    faceDetection.setOptions({
        model: 'short',
        minDetectionConfidence: 0.5
    });

    faceDetection.onResults(drawHat);

    const camera = new window.Camera(video, {
        onFrame: async () => {
            await faceDetection.send({ image: video });
        },
        width: 640,
        height: 480
    });

    camera.start();
}

function drawHat(results) {
    ctx.clearRect(0, 0, overlay.width, overlay.height);

    if (!hatOn || !results.detections.length) return;

    const box = results.detections[0].boundingBox;

    const w = box.width * overlay.width * 1.4;
    const h = w * 0.5;
    const x = box.xCenter * overlay.width - w / 2;
    const y = box.yCenter * overlay.height - box.height * overlay.height * 0.9;

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.ellipse(x + w/2, y + h*0.4, w/2, h*0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    if (hatImage.complete) {
        const lw = w * 0.6;
        const lh = lw * (hatImage.height / hatImage.width);
        ctx.drawImage(hatImage, x + w/2 - lw/2, y + h*0.15, lw, lh);
    }
}
</script>

</body>
</html>
