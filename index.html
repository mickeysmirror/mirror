<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mickey's Mirror</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: #c9a050;
        }

        #container {
            position: relative;
            width: 90%;
            max-width: 500px;
            border: 5px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background: #000;
        }

        video {
            width: 100%;
            display: block;
        }

        #overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #333;
            color: #fff;
            border: 1px solid #c9a050;
            padding: 10px 15px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        button:hover {
            background: #c9a050;
            color: #000;
        }

        #capture-btn {
            background: #c9a050;
            color: #000;
            font-weight: bold;
        }

        #hat-toggle {
            background: #555;
        }

        #hat-toggle.active {
            background: #c9a050;
            color: #000;
        }

        #photo-strip {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            width: 90%;
            padding: 10px;
        }

        .thumbnail {
            width: 80px;
            border: 2px solid #c9a050;
        }
