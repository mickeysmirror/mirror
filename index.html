<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mickey's Mirror</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

#video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    background: #000;
}

#logo {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 150px;
    opacity: 0.8;
    pointer-events: none;
    z-index: 5;
}

#prompt {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 10;
}

#allowBtn {
    background: rgba(0,0,0,0.8);
    border: 2px solid #c9a050;
    color: #c9a050;
    padding: 15px 40px;
    font-size: 1rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Courier New', Courier, monospace;
}
</style>
</head>

<body>

<div id="prompt">
    <button id="allowBtn">Allow</button>
</div>

<video id="video" autoplay playsinline muted></video>
<img id="logo" src="alb-logo.png" alt="">

<script>
const video = document.getElementById('video');
const prompt = document.getElementById('prompt');
const allowBtn = document.getElementById('allowBtn');

allowBtn.addEventListener('click', async () => {
    prompt.style.display = 'none';

    const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' },
        audio: false
    });

    video.srcObject = stream;
});
</script>

</body>
</html>
