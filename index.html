<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mickey's Mirror</title>
<style>
    html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        background: #000; overflow: hidden;
        display: flex; justify-content: center; align-items: center;
    }

    #video {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        object-fit: cover;
        transform: scaleX(-1); 
        z-index: 1;
        display: none;
    }

    #promo-bottom {
        position: fixed;
        bottom: 50px;
        width: 90%;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 10;
        display: none;
        pointer-events: none;
        transition: opacity 0.5s ease-in-out;
    }

    .promo-main {
        color: #fff;
        font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 1.5rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 8px;
        text-shadow: 3px 3px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000, 1px 1px 0px #000;
    }

    .promo-sub {
        color: #c9a050; 
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.9rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-shadow: 2px 2px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000, 1px 1px 0px #000;
    }

    #mirror-text {
        position: fixed;
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        text-align: center;
        color: #c9a050;
        font-family: 'Courier New', Courier, monospace;
        font-size: 1.3rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 2px;
        z-index: 20;
        text-shadow: 2px 2px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000, 1px 1px 0px #000;
        pointer-events: none;
        transition: opacity 0.5s ease-in-out;
    }

    #tap-message {
        color: #c9a050;
        font-family: 'Courier New', Courier, monospace;
        font-size: 1.5rem;
        font-weight: bold;
        text-transform: uppercase;
        text-align: center;
        z-index: 100;
        cursor: pointer;
        padding: 20px;
        border: 2px solid #c9a050;
    }
</style>
</head>
<body onclick="startMirror()">

<div id="tap-message">TAP TO SEE THE REAL YOU</div>

<video id="video" autoplay playsinline muted></video>

<div id="mirror-text"></div>

<div id="promo-bottom">
    <div id="promo-main-text" class="promo-main"></div>
    <div id="promo-sub-text" class="promo-sub"></div>
</div>
