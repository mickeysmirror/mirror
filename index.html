<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mickey's Mirror</title>
<style>
    html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        background: #000; overflow: hidden;
    }

    #video {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        object-fit: cover;
        /* THIS FLIPS THE CAMERA TO BE A MIRROR */
        transform: scaleX(-1); 
    }

    #logo-watermark {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 120px; /* Adjust size as needed */
        opacity: 0.7;
        z-index: 10;
        pointer-events: none;
    }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<img id="logo-watermark" src="alb-logo.png">

<script>
    async function init() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user' },
                audio: false
            });
            document.getElementById('video').srcObject = stream;
        } catch (e) {
            alert("Please allow camera access to use the mirror.");
        }
    }
    init();
</script>

</body>
</html>
