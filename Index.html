<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mirror</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        video { width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); }
        #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-family: sans-serif; text-align: center; width: 80%; }
    </style>
</head>
<body>
    <div id="msg">Tap to start mirror</div>
    <video id="video" autoplay playsinline></video>
    <script>
        const video = document.getElementById('video');
        const msg = document.getElementById('msg');
        
        async function startMirror() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                video.srcObject = stream;
                msg.style.display = 'none';
            } catch (err) {
                msg.innerHTML = "Camera access denied or not supported.<br>Please allow camera permissions.";
            }
        }

        document.body.addEventListener('click', startMirror);
        // Try to start automatically, but most browsers need a click
        startMirror();
    </script>
</body>
</html>
